plugins { id 'com.android.application' }
android {
 namespace 'uk.me.theflat.hotspot'
 compileSdk 36
 defaultConfig { applicationId 'uk.me.theflat.hotspot'; minSdk 31; targetSdk 36; versionCode 13; versionName '0.4.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation "dev.rikka.shizuku:api:13.1.5"; implementation "dev.rikka.shizuku:provider:13.1.5" }

// Production signing is opt-in. No development key or signing passwords in source.
def releaseStore = System.getenv('RELEASE_STORE_FILE')
if (releaseStore) {
 android.signingConfigs.create('production') {
  storeFile file(releaseStore)
  storePassword System.getenv('RELEASE_STORE_PASSWORD')
  keyAlias System.getenv('RELEASE_KEY_ALIAS')
  keyPassword System.getenv('RELEASE_KEY_PASSWORD')
 }
 android.buildTypes.release.signingConfig = android.signingConfigs.production
}
