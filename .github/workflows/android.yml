name: Android APK
on:
  push:
    paths: ['app/**', 'scripts/**', 'tests/**', '*.gradle', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'scripts/**', 'tests/**', '*.gradle', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure development signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          else
            echo '::warning::No signing secret configured. APK gets an ephemeral development certificate.'
          fi
      - name: Compile, verify signature and check rules
        run: scripts/build.sh "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: HotspotKeeper-debug
          path: dist/HotspotKeeper-debug.apk
          if-no-files-found: error
