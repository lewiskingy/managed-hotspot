name: Release preparation
on:
  pull_request:
    paths: ['app/**', '*.gradle', '.github/workflows/release-preparation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned review bundle (not upload-ready)
        run: gradle --no-daemon :app:bundleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Keeper-unsigned-review-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
